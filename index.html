<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Birdie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#235229">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Birdie ⛳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#235229;color:#fff;font:16px -apple-system,system-ui,sans-serif;overflow:hidden}
#menu,#game,#editor{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button,input{font:inherit;color:#fff;background:rgba(255,255,255,.2);border:0;border-radius:12px;padding:8px 14px}
button.on{background:#fff;color:#235229;font-weight:700}
button.pri{background:#fff;color:#235229;font-weight:700}
#menu{padding:20px;overflow:auto;display:block}
#menu h1{margin:10px 0 16px}.row{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.25);border-radius:14px;padding:12px;margin-bottom:10px}
.row div{flex:1}.row small{opacity:.8}#menu>button{display:block;width:100%;margin-bottom:10px;padding:14px}
#bar,#cb,#eb,#pal{display:flex;gap:8px;align-items:center;padding:8px 12px;justify-content:center;flex-wrap:wrap}
#bar{justify-content:space-between}#st{font-size:28px}
#cv,#ec{flex:1;min-height:0;width:100%;touch-action:none;display:block}
#bn{position:fixed;left:0;right:0;top:35%;text-align:center;font-size:26px;font-weight:700;pointer-events:none;text-shadow:0 2px 8px #000}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#ov>div{background:#1b3f20;border-radius:20px;padding:24px;text-align:center;min-width:260px;max-height:80%;overflow:auto}
#ov h2{margin:0 0 8px;font-size:30px}#ov button{margin:8px 4px 0}
#en{width:calc(100% - 24px);margin:8px 12px 0;background:rgba(255,255,255,.15)}
#pal button{width:58px;padding:6px 2px;font-size:11px}
</style></head><body>
<div id="menu"><h1>Birdie ⛳</h1><div id="list"></div>
<button id="nw">＋ Créer mon parcours</button><button id="im">⤓ Importer (coller un lien)</button></div>
<div id="game" hidden><div id="bar"><button id="x">✕</button><span id="hh"></span><b id="st"></b><button id="vw">3D</button><span id="wd"></span></div>
<canvas id="cv"></canvas><div id="cb"></div><div id="bn"></div><div id="ov" hidden></div></div>
<div id="editor" hidden><input id="en" maxlength="40"><div id="eb"></div><canvas id="ec"></canvas><div id="pal"></div></div>
<script>
const C=12,R=20,COL=['#337338','#5cae4f','#8cdb75','#ebd694','#3385db','#337338'],FR=[4.5,1.8,1.1,9,1,4.5],
CLUB={Driver:[16,.45],Fer:[10,.35],Wedge:[5.5,.15],Putter:[0,1]};
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,m=>'&#'+m.charCodeAt()+';'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sh=(h,k)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*k).toString(16).padStart(2,'0')).join('');
const STR=COL.map((c,i)=>i==1||i==2?sh(c,.92):c),pos=a=>[a[0]+.5,R-a[1]-.5];
const par=h=>{const d=Math.hypot(h.p[0]-h.s[0],h.p[1]-h.s[1]);return d<9?3:d<16?4:5};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(seed){const r=rng(seed*7919+17),t=Array(C*R).fill(0),amp=r()*3.5,fq=.5+r(),pr=2+(r()*8|0);
 const ce=y=>Math.min(C-4,Math.max(3,Math.round((C-1)/2+amp*Math.sin((R-1-y)/(R-1)*Math.PI*2*fq))));
 const put=(v,c,y)=>{if(c>=0&&c<C&&y>=0&&y<R)t[y*C+c]=v};
 for(let y=Math.max(0,pr-3);y<R;y++)for(let d=-2;d<=2;d++)put(1,ce(y)+d,y);
 const p=[ce(pr),pr],s=[ce(R-2),R-2];
 for(let y=0;y<R;y++)for(let c=0;c<C;c++)if(Math.hypot(c-p[0],y-p[1])<=2.3)put(2,c,y);
 for(let i=0;i<2;i++){const y=pr+2+(r()*(R-7-pr)|0),c0=ce(y)+(r()<.5?2:-4);for(let a=0;a<3;a++)for(let b=0;b<2;b++)put(3,c0+a,y+b)}
 {const y=pr+3+(r()*(R-8-pr)|0),c0=r()<.5?ce(y)-1:ce(y)+(r()<.5?3:-5);for(let a=0;a<3;a++)for(let b=0;b<2;b++)put(4,c0+a,y+b)}
 for(let i=0;i<40;i++){const c=r()*C|0,y=r()*R|0;if(t[y*C+c]==0&&Math.hypot(c-s[0],y-s[1])>3&&Math.hypot(c-p[0],y-p[1])>3)t[y*C+c]=5}
 const h={t:t.join(''),s,p};h.par=par(h);return h}
const fresh=n=>({id:uid(),name:'Mon parcours',holes:Array.from({length:n},()=>gen(1+Math.random()*9e6|0))});
let courses;try{courses=JSON.parse(localStorage.birdie)}catch(e){}
if(!Array.isArray(courses)||!courses.length)courses=[{id:'demo',name:'Parcours Découverte',holes:Array.from({length:9},(_,i)=>gen(i+1))}];
const save=()=>{try{localStorage.birdie=JSON.stringify(courses)}catch(e){}};
const show=id=>['menu','game','editor'].forEach(x=>$('#'+x).hidden=x!=id);

/* ---------- partage : lien #c=<code> (RLE + base64url) ---------- */
function enc(c){const o={n:c.name,h:c.holes.map(h=>[h.t.replace(/(.)\1*/g,(m,d)=>String.fromCharCode(97+ +d)+(m.length>1?m.length:'')),...h.s,...h.p,h.par])};
 return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){try{s=s.trim();const i=s.indexOf('#c=');if(i>=0)s=s.slice(i+3);s=s.split(/\s/)[0].replace(/-/g,'+').replace(/_/g,'/');
 const o=JSON.parse(decodeURIComponent(escape(atob(s+'='.repeat((4-s.length%4)%4)))));if(!o.h||o.h.length<1||o.h.length>30)return null;
 const holes=o.h.map(a=>{const t=a[0].replace(/([a-f])(\d*)/g,(m,l,n)=>String(l.charCodeAt()-97).repeat(+n||1)),[,c1,r1,c2,r2,pr]=a;
  if(t.length!=C*R||!/^[0-5]+$/.test(t)||c1<0||c1>=C||c2<0||c2>=C||r1<0||r1>=R||r2<0||r2>=R)throw 0;return{t,s:[c1,r1],p:[c2,r2],par:Math.min(5,Math.max(3,pr|0))}});
 return{id:uid(),name:String(o.n).slice(0,40),holes}}catch(e){return null}}
async function share(c){const url=location.href.split('#')[0]+'#c='+enc(c);
 try{if(navigator.share){await navigator.share({title:c.name,text:'⛳ '+c.name+' sur Birdie',url});return}}catch(e){if(e.name=='AbortError')return}
 try{await navigator.clipboard.writeText(url);alert('Lien copié, collez-le dans un message.')}catch(e){prompt('Copiez ce lien :',url)}}
function imp(txt){const c=dec(txt||'');if(!c)return alert('Lien ou code invalide.');courses.push(c);save();menu();alert('Parcours importé : '+c.name)}

/* ---------- menu ---------- */
function menu(){show('menu');const L=$('#list');L.innerHTML='';courses.forEach(c=>{const d=document.createElement('div'),b=+localStorage['best'+c.id]||0;d.className='row';
 d.innerHTML=`<div><b>${esc(c.name)}</b><br><small>${c.holes.length} trous · Par ${c.holes.reduce((a,h)=>a+h.par,0)}${b?' · 🏆 '+b:''}</small></div>`;
 [['▶',()=>play(c)],['✎',()=>edit(c)],['⇪',()=>share(c)],['⧉',()=>{courses.push({...JSON.parse(JSON.stringify(c)),id:uid(),name:c.name+' (copie)'});save();menu()}],
 ['🗑',()=>{if(confirm('Supprimer ce parcours ?')){courses=courses.filter(x=>x!=c);if(!courses.length)courses=[fresh(3)];save();menu()}}]]
 .forEach(([t,f],i)=>{const k=document.createElement('button');k.textContent=t;k.onclick=f;if(!i)k.className='pri';d.append(k)});L.append(d)})}
$('#nw').onclick=()=>edit(fresh(3),1);$('#im').onclick=()=>{const t=prompt('Collez le lien reçu :');if(t)imp(t)};

/* ---------- jeu ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let G,W,H_,foc,dpr=1,lt=0;
const H=()=>G.c.holes[G.i],tl=(x,y)=>x<0||y<0||x>=C||y>=R?-1:+H().t[(R-1-Math.floor(y))*C+Math.floor(x)];
function play(c,ret){G={c,i:0,sc:[],ret,top:0,ds:0,aim:0,club:'Driver'};ld();show('game');cbuild();rs()}
function ld(){const g=G,h=H(),a=Math.random()*6.283,s=Math.random()*1.9;g.strokes=0;g.wind=[Math.cos(a)*s,Math.sin(a)*s];
 [g.px,g.py]=pos(h.p);[g.x,g.y]=pos(h.s);g.last=[g.x,g.y];g.fx=g.x;g.fy=g.y;g.hd=Math.atan2(g.px-g.x,g.py-g.y);
 g.moving=g.done=g.holed=g.sink=g.air=g.vx=g.vy=0;sug();hud();ov(0)}
function sug(){const g=G,d=Math.hypot(g.x-g.px,g.y-g.py);g.club=tl(g.x,g.y)==2?'Putter':d<4.5?'Wedge':d<9?'Fer':'Driver';cl()}
function hud(){const g=G;$('#hh').textContent=`Trou ${g.i+1}/${g.c.holes.length} · Par ${H().par}`;$('#st').textContent=g.strokes;
 $('#wd').innerHTML=`<span style="display:inline-block;transform:rotate(${Math.atan2(g.wind[0],g.wind[1])}rad)">↑</span> ${Math.round(Math.hypot(...g.wind)*6*32/32)} km/h`}
function cbuild(){const b=$('#cb');b.innerHTML='';Object.keys(CLUB).forEach(k=>{const e=document.createElement('button');e.textContent=k;e.onclick=()=>{G.club=k;cl()};b.append(e)});cl()}
const cl=()=>[...$('#cb').children].forEach(e=>e.className=e.textContent==G.club?'on':'');
function flash(m){$('#bn').textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>$('#bn').textContent='',1800)}
function ov(h){const o=$('#ov');o.hidden=!h;if(h)o.innerHTML='<div>'+h+'</div>'}
function shoot(dx,dy,pw){const g=G,[mt,rl]=CLUB[g.club];g.strokes++;g.last=[g.x,g.y];g.moving=1;navigator.vibrate&&navigator.vibrate(15);
 if(mt){const c=mt*pw*.65,tf=.5+.7*pw;g.airT=g.air=tf;g.land=rl;g.vx=dx*c/tf;g.vy=dy*c/tf}else{g.air=g.airT=0;g.vx=dx*9.375*pw;g.vy=dy*9.375*pw}hud()}
function pen(m){const g=G;g.strokes++;flash(m);[g.x,g.y]=g.last;g.vx=g.vy=g.air=g.moving=0;rest();hud()}
function rest(){const g=G;if(g.strokes>=H().par+5){flash('Balle ramassée');g.done=1;setTimeout(fin,800)}else sug()}
function step(dt){const g=G;
 if(g.air>0){g.vx+=g.wind[0]*dt;g.vy+=g.wind[1]*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.air-=dt;
  if(g.air<=0){g.vx*=g.land;g.vy*=g.land;const t=tl(g.x,g.y);if(t<0)pen('Hors limites !');else if(t==4)pen('Plouf !');else if(t==5)pen('Dans les arbres !')}return}
 const f=Math.exp(-FR[Math.max(0,tl(g.x,g.y))]*dt);g.vx*=f;g.vy*=f;let nx=g.x+g.vx*dt,ny=g.y+g.vy*dt;
 if(tl(nx,ny)<0)return pen('Hors limites !');
 if(tl(nx,ny)==5){if(tl(nx,g.y)==5){g.vx*=-.5;nx=g.x}if(tl(nx,ny)==5){g.vy*=-.5;ny=g.y}}
 g.x=nx;g.y=ny;if(tl(nx,ny)==4)return pen('Plouf !');const sp=Math.hypot(g.vx,g.vy);
 if(Math.hypot(g.x-g.px,g.y-g.py)<.22&&sp<7.5){g.x=g.px;g.y=g.py;g.vx=g.vy=g.moving=0;g.done=g.holed=1;navigator.vibrate&&navigator.vibrate([20,40,20]);setTimeout(fin,600);return}
 if(sp<.375){g.vx=g.vy=g.moving=0;rest()}}
function fin(){const g=G,h=H(),d=g.strokes-h.par,n=g.strokes==1?'Trou en un !':d<=-3?'Albatros !':['Eagle !','Birdie !','Par','Bogey','Double bogey'][d+2]||'+'+d;
 g.sc.push(g.strokes);const last=g.i+1>=g.c.holes.length;ov(`<h2>${n}</h2><p>${g.strokes} coups · Par ${h.par}</p><button class=pri id=nx>${last?'Carte de score':'Trou suivant'}</button>`);
 $('#nx').onclick=()=>{if(!last){g.i++;ld();return}card()}}
function card(){const g=G,tot=g.sc.reduce((a,b)=>a+b,0),df=tot-g.c.holes.reduce((a,h)=>a+h.par,0),k='best'+g.c.id,old=+localStorage[k]||0,rec=!old||tot<old;
 if(rec)try{localStorage[k]=tot}catch(e){}
 ov(`<h2>Carte de score</h2>${g.c.holes.map((h,i)=>`<div style="display:flex;justify-content:space-between;gap:20px"><span>Trou ${i+1}</span><span>Par ${h.par}</span><b>${g.sc[i]??'–'}</b></div>`).join('')}
 <p><b>Total ${tot} (${df?(df>0?'+':'')+df:'±0'})</b>${rec?'<br>🏆 Nouveau record !':''}</p><button class=pri id=rp>Rejouer</button><button id=qt>Quitter</button>`);
 $('#rp').onclick=()=>play(g.c,g.ret);$('#qt').onclick=quit}
function quit(){const r=G.ret;G=null;r?r():menu()}
$('#x').onclick=quit;$('#vw').onclick=()=>{G.top^=1;$('#vw').textContent=G.top?'2D':'3D'};

function rs(){dpr=devicePixelRatio||1;for(const c of[cv,$('#ec')]){c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr}W=cv.clientWidth;H_=cv.clientHeight;if(ED)ded()}
addEventListener('resize',rs);
const dp=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nz=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)};
function draw(){const g=G,h=H(),ctx=cx;ctx.setTransform(dpr,0,0,dpr,0,0);let CP,F,Rt,U;
 if(g.top){CP=[C/2,R/2,30];F=[0,0,-1];Rt=[1,0,0];U=[0,1,0];foc=Math.min(W/C,H_/R)*30}
 else{const fx=Math.sin(g.hd),fy=Math.cos(g.hd);CP=[g.fx-fx*5.2,g.fy-fy*5.2,3];F=nz([g.fx+fx*2.4-CP[0],g.fy+fy*2.4-CP[1],-3]);
  Rt=nz([F[1],-F[0],0]);U=[Rt[1]*F[2]-Rt[2]*F[1],Rt[2]*F[0]-Rt[0]*F[2],Rt[0]*F[1]-Rt[1]*F[0]];foc=W*.714}
 const pj=p=>{const d=[p[0]-CP[0],p[1]-CP[1],p[2]-CP[2]],z=dp(d,F);return z<.15?null:[W/2+dp(d,Rt)/z*foc,H_/2-dp(d,U)/z*foc,z]};
 ctx.fillStyle='#235229';ctx.fillRect(0,0,W,H_);
 if(!g.top){const hy=Math.max(0,H_/2-foc*Math.tan(Math.asin(-F[2])));ctx.fillStyle='#8cc7f5';ctx.fillRect(0,0,W,hy)}
 const ob=[];
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=+h.t[r*C+c],y0=R-r-1,q=[[c,y0],[c+1,y0],[c+1,y0+1],[c,y0+1]].map(a=>pj([a[0],a[1],0]));
  if(t==5){const z=pj([c+.5,y0+.5,0]);if(z)ob.push([z[2],'t',c+.5,y0+.5,1])}
  if(q.some(a=>!a))continue;ctx.fillStyle=ctx.strokeStyle=r%2?COL[t]:STR[t];ctx.beginPath();q.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath();ctx.fill();ctx.stroke()}
 for(let i=0;i<14;i++)for(const x of[-.9,C+.9]){const z=pj([x,i*1.5+.5,0]);if(z)ob.push([z[2],'t',x,i*1.5+.5,1.2+.3*(i%3)])}
 const hh=g.air>0?Math.sin(Math.PI*(1-g.air/g.airT))*2*Math.min(1,g.airT/1.2):0,bs=pj([g.x,g.y,0]);
 if(bs){const rx=.17*foc/bs[2]/(1+hh*.6);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(bs[0],bs[1],rx,rx*(g.top?1:.4),0,0,7);ctx.fill()}
 const pb=pj([g.px,g.py,0]);if(pb)ob.push([pb[2],'p']);const bb=pj([g.x,g.y,.17+hh]);if(bb)ob.push([bb[2]-.01,'b']);
 ob.sort((a,b)=>b[0]-a[0]);
 for(const [z,k,x,y,s] of ob){
  if(k=='t'){const b=pj([x,y,0]);if(g.top){ctx.fillStyle='#1d5c25';ctx.beginPath();ctx.arc(b[0],b[1],.45*s*foc/b[2],0,7);ctx.fill();continue}
   const a=[.3,1.1,.85,1.75].map(v=>pj([x,y,v*s]));if(a.some(v=>!v))continue;
   ctx.strokeStyle='#6b4829';ctx.lineWidth=Math.max(2,.12*foc/b[2]);ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(a[0][0],a[0][1]);ctx.stroke();
   [[a[0],a[1],.42,'#14602a'],[a[2],a[3],.3,'#1f7a35']].forEach(([bs2,ap,w,col])=>{const hw=w*s*foc/bs2[2];ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(bs2[0]-hw,bs2[1]);ctx.lineTo(bs2[0]+hw,bs2[1]);ctx.lineTo(ap[0],ap[1]);ctx.fill()})}
  else if(k=='p'){const rx=.17*foc/pb[2];ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(pb[0],pb[1],rx,rx*(g.top?1:.4),0,0,7);ctx.fill();
   const t=pj([g.px,g.py,1.3]),f1=pj([g.px+Rt[0]*.5,g.py+Rt[1]*.5,1.15]),f2=pj([g.px,g.py,1]);if(!t||!f1||!f2)continue;
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pb[0],pb[1]);ctx.lineTo(t[0],t[1]);ctx.stroke();
   ctx.fillStyle='#e22';ctx.beginPath();ctx.moveTo(t[0],t[1]);ctx.lineTo(f1[0],f1[1]);ctx.lineTo(f2[0],f2[1]);ctx.fill()}
  else{const r=.17*foc/bb[2]*(1-.8*g.sink);ctx.fillStyle='#fff';ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bb[0],bb[1],Math.max(2,r),0,7);ctx.fill();ctx.stroke()}}
 if(g.aim){const a=g.aim,[mt]=CLUB[g.club],d=mt?mt*a.pw*.65:9.375*a.pw/FR[Math.max(0,tl(g.x,g.y))],p1=pj([g.x,g.y,.03]),p2=pj([g.x+a.dx*d,g.y+a.dy*d,.03]);
  if(p1&&p2){ctx.strokeStyle=`rgb(255,${255-a.pw*150|0},${255-a.pw*255|0})`;ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();ctx.setLineDash([]);
   ctx.beginPath();ctx.arc(p2[0],p2[1],.2*foc/p2[2],0,7);ctx.stroke()}}}
function aimv(e){const g=G,sx=g.ds[0]-e.clientX,sy=e.clientY-g.ds[1],l=Math.hypot(sx,sy);if(l<2)return null;
 const f=g.top?[0,1]:[Math.sin(g.hd),Math.cos(g.hd)],r=[f[1],-f[0]];return{dx:(f[0]*sy+r[0]*sx)/l,dy:(f[1]*sy+r[1]*sx)/l,pw:Math.min(l/130,1)}}
cv.onpointerdown=e=>{if(!G||G.moving||G.done||!$('#ov').hidden)return;cv.setPointerCapture(e.pointerId);G.ds=[e.clientX,e.clientY]};
cv.onpointermove=e=>{if(G&&G.ds)G.aim=aimv(e)};
cv.onpointerup=e=>{if(!G||!G.ds)return;const a=aimv(e);G.ds=0;G.aim=0;if(a&&a.pw>.08)shoot(a.dx,a.dy,a.pw)};
cv.onpointercancel=()=>{if(G){G.ds=0;G.aim=0}};
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-lt)/1000||0,1/30);lt=t;
 if(G&&!$('#game').hidden){const g=G;if(g.moving)step(dt);if(g.holed)g.sink=Math.min(1,g.sink+dt*4);g.fx+=(g.x-g.fx)*.12;g.fy+=(g.y-g.fy)*.12;
  if(!g.moving&&Math.hypot(g.px-g.x,g.py-g.y)>.6){const a=Math.atan2(g.px-g.x,g.py-g.y);g.hd+=Math.atan2(Math.sin(a-g.hd),Math.cos(a-g.hd))*.08}
  hud.t=(hud.t||0)+1;if(g.moving&&hud.t%6==0)hud();draw()}}

/* ---------- éditeur ---------- */
let ED=null;const ec=$('#ec'),ex=ec.getContext('2d'),TN=['Rough','Fairway','Green','Bunker','Eau','Arbre'];
function edit(c,isNew){ED={c:JSON.parse(JSON.stringify(c)),i:0,tool:'1',isNew};show('editor');$('#en').value=ED.c.name;$('#en').oninput=e=>ED.c.name=e.target.value;
 const p=$('#pal');p.innerHTML='';[...TN.map((n,i)=>[''+i,n,COL[i]]),['T','🏁 Départ','#555'],['P','⛳ Drapeau','#555']].forEach(([k,n,col])=>{const b=document.createElement('button');b.textContent=n;b.style.background=col;b.dataset.k=k;
 b.onclick=()=>{ED.tool=k;eb()};p.append(b)});eb();rs()}
function eb(){const e=ED,h=e.c.holes[e.i],B=$('#eb');B.innerHTML='';
 [['◀',()=>e.i=Math.max(0,e.i-1)],[`Trou ${e.i+1}/${e.c.holes.length}`,0],['▶',()=>e.i=Math.min(e.c.holes.length-1,e.i+1)],['Par −',()=>h.par=Math.max(3,h.par-1)],[`${h.par}`,0],['Par +',()=>h.par=Math.min(5,h.par+1)],
 ['＋ trou',()=>{e.c.holes.push(gen(1+Math.random()*9e6|0));e.i=e.c.holes.length-1}],['🎲',()=>e.c.holes[e.i]=gen(1+Math.random()*9e6|0)],
 ['🗑',()=>{if(e.c.holes.length>1){e.c.holes.splice(e.i,1);e.i=Math.min(e.i,e.c.holes.length-1)}}],['▶ Tester',()=>{save();const c=JSON.parse(JSON.stringify(e.c));c.holes=[e.c.holes[e.i]];c.id='test';ED=null;play(c,()=>{ED=e;show('editor');rs();eb()});return 1}],
 ['⇪',()=>{share(e.c);return 1}],['Annuler',()=>{ED=null;menu();return 1}],['Enregistrer',()=>{const i=courses.findIndex(c=>c.id==e.c.id);i<0?courses.push(e.c):courses[i]=e.c;save();ED=null;menu();return 1}]]
 .forEach(([t,f],k)=>{const b=document.createElement('button');b.textContent=t;if(f)b.onclick=()=>{if(!f())eb();if(ED)ded()};if(k==11)b.className='pri';B.append(b)});
 [...$('#pal').children].forEach(b=>b.className=b.dataset.k==e.tool?'on':'');if(ED)ded()}
function geo(){const w=ec.clientWidth,h=ec.clientHeight,cs=Math.min(w/C,h/R);return{cs,ox:(w-cs*C)/2,oy:(h-cs*R)/2}}
function ded(){if(!ED)return;const{cs,ox,oy}=geo(),h=ED.c.holes[ED.i];ex.setTransform(dpr,0,0,dpr,0,0);ex.clearRect(0,0,ec.clientWidth,ec.clientHeight);ex.font=cs*.8+'px sans-serif';ex.textAlign='center';ex.textBaseline='middle';
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=+h.t[r*C+c];ex.fillStyle=COL[t];ex.fillRect(ox+c*cs,oy+r*cs,cs+.5,cs+.5);if(t==5)ex.fillText('🌲',ox+(c+.5)*cs,oy+(r+.5)*cs)}
 ex.fillText('🏁',ox+(h.s[0]+.5)*cs,oy+(h.s[1]+.5)*cs);ex.fillText('⛳',ox+(h.p[0]+.5)*cs,oy+(h.p[1]+.5)*cs)}
function paint(e){if(!ED)return;const{cs,ox,oy}=geo(),b=ec.getBoundingClientRect(),c=Math.floor((e.clientX-b.left-ox)/cs),r=Math.floor((e.clientY-b.top-oy)/cs),h=ED.c.holes[ED.i];
 if(c<0||c>=C||r<0||r>=R)return;const k=r*C+c,set=v=>h.t=h.t.slice(0,k)+v+h.t.slice(k+1),t=ED.tool,cur=+h.t[k];
 if(t=='T'){if(cur>3)set(1);h.s=[c,r];h.par=par(h);eb()}else if(t=='P'){if(cur>3)set(2);h.p=[c,r];h.par=par(h);eb()}
 else{if((t=='4'||t=='5')&&(h.s[0]==c&&h.s[1]==r||h.p[0]==c&&h.p[1]==r))return;set(t)}ded()}
ec.onpointerdown=e=>{ec.setPointerCapture(e.pointerId);ec.d=1;paint(e)};ec.onpointermove=e=>{if(ec.d)paint(e)};ec.onpointerup=()=>ec.d=0;

/* ---------- démarrage ---------- */
if(location.hash.startsWith('#c=')){const c=dec(location.hash);history.replaceState(null,'',location.pathname);if(c){courses.push(c);save();setTimeout(()=>alert('Parcours importé : '+c.name),300)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
menu();requestAnimationFrame(loop);
</script></body></html>
